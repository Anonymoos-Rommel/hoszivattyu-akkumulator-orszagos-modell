name: Forrás- vagy adatjavaslat
description: Új hivatalos forrás, adatjavítás vagy bizonyítékhiány bejelentése.
title: "[EVIDENCE] "
labels: ["evidence"]
body:
  - type: dropdown
    id: module
    attributes:
      label: Érintett modul
      options:
        - B01
        - B02
        - B03
        - B04
        - B05
        - B06
        - B07
        - B08
        - B09
        - B10
        - B11
        - B12
        - B13
        - B14
        - B15
        - B16
        - B17
        - B18
        - B19
        - B20
        - Több modul
    validations:
      required: true
  - type: input
    id: institution
    attributes:
      label: Intézmény vagy kiadó
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Hivatalos URL
    validations:
      required: true
  - type: input
    id: dates
    attributes:
      label: Publikációs dátum és vonatkozási időszak
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: Mit bizonyít vagy javít a forrás?
    validations:
      required: true
  - type: textarea
    id: license
    attributes:
      label: Licenc vagy továbbközlési korlát
    validations:
      required: true
