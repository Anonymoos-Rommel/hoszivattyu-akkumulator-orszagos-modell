name: B02 P15 materialize WBL011 full joint

on:
  push:
    branches:
      - agent/b02-p15-wbl011-full-joint-materialization
    paths:
      - .github/workflows/b02_p15_materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b02-p15-wbl011-full-joint-materialization
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extend canonical B02 extractor with full WBL011 stock joint
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/extract_b02_ksh_wbl_joint_cells.py')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'The extractor deliberately keeps the three projections separate.  It never\n'
              'cross-multiplies margins and never interprets an API combination that was not\n'
              'returned as a zero observation.',
              'The extractor materializes source-native observed projections only. It never\n'
              'cross-multiplies margins and never interprets an API combination that was not\n'
              'returned as a zero observation.'
          )

          marker = '''    Projection(\n        projection_id="WBL017_HEAT_PUMP_BASELINE",'''
          full_projection = '''    Projection(\n        projection_id="WBL011_FULL_STOCK_JOINT",\n        prefix="FULL",\n        dataflow_id="WBL011",\n        grain=(\n            "county_x_settlement_type_x_construction_period_x_wall_material_"\n            "x_floor_area_x_comfort_x_heating_mode_x_heating_fuel"\n        ),\n        selections={\n            "TIME_PERIOD": ("2022",),\n            "TERUL_GEO3": (),\n            "TERUL_TELTIP2": SETTLEMENT_TYPES,\n            "LAKAS_OCS": ("DW_OC",),\n            "EPEV_POC1": PERIODS,\n            "FALA_V": WALLS,\n            "LAT_V": FLOOR_AREAS,\n            "KOMF": COMFORTS,\n            "FUTES_TOH": HEATING_MODES,\n            "FUTAGOK": HEATING_FUELS,\n        },\n        varied_dimensions=(\n            "TERUL_GEO3", "TERUL_TELTIP2", "EPEV_POC1", "FALA_V",\n            "LAT_V", "KOMF", "FUTES_TOH", "FUTAGOK",\n        ),\n    ),\n'''
          if 'projection_id="WBL011_FULL_STOCK_JOINT"' not in text:
              if marker not in text:
                  raise SystemExit('WBL017 projection marker not found')
              text = text.replace(marker, full_projection + marker, 1)

          text = text.replace(
              '"Three separate observed projections; no cross-projection join or "\n'
              '                "independence multiplication."',
              '"Four source-native observed projections; WBL011_FULL_STOCK_JOINT is "\n'
              '                "returned directly by KSH; no synthetic cross-projection join "\n'
              '                "or independence multiplication."'
          )
          text = text.replace(
              '"projection_count": len(PROJECTIONS),\n            "projections": details["projections"],',
              '"projection_count": len(PROJECTIONS),\n            "wbl011_full_stock_joint_materialization_status": "MATERIALIZED",\n            "projections": details["projections"],'
          )
          text = text.replace(
              'f"cells={len(rows)} {summaries} full_joint=Q eligibility=Q"',
              'f"cells={len(rows)} {summaries} full_wbl011_joint=MATERIALIZED "\n'
              '        f"full_archetype=Q eligibility=Q"'
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Materialize pinned WBL011/V67 full joint
        run: |
          python tools/extract_b02_ksh_wbl_joint_cells.py \
            --retrieved-at 2026-09-05 \
            --workers 8

      - name: Verify exact P15 controls
        run: |
          python - <<'PY'
          import csv, json
          from collections import Counter, defaultdict
          from pathlib import Path

          root = Path('data/processed/b02')
          with (root / 'ksh_wbl_joint_cells_2022.csv').open(encoding='utf-8', newline='') as f:
              rows = list(csv.DictReader(f))
          counts = Counter(r['projection_id'] for r in rows)
          expected = {
              'WBL011_ENVELOPE': 32655,
              'WBL011_HEATING_FUEL': 7682,
              'WBL011_FULL_STOCK_JOINT': 116452,
              'WBL017_HEAT_PUMP_BASELINE': 7623,
          }
          if dict(counts) != expected:
              raise SystemExit(f'projection count drift: {dict(counts)!r}')
          if len(rows) != 164412:
              raise SystemExit(f'total row drift: {len(rows)}')
          totals = defaultdict(int)
          for row in rows:
              totals[row['projection_id']] += int(row['dwelling_count'])
          if totals['WBL011_FULL_STOCK_JOINT'] != 4008541:
              raise SystemExit(f'full-joint population drift: {totals["WBL011_FULL_STOCK_JOINT"]}')
          manifest = json.loads((root / 'ksh_wbl_joint_manifest.json').read_text(encoding='utf-8'))
          if manifest['controls']['query_count'] != 80:
              raise SystemExit(f'query count drift: {manifest["controls"]["query_count"]}')
          if manifest['controls']['wbl011_full_stock_joint_materialization_status'] != 'MATERIALIZED':
              raise SystemExit('full-joint materialization status not MATERIALIZED')
          print('VALID: P15 full-joint rows=116452 population=4008541 queries=80')
          PY

      - name: Commit deterministic materialization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/extract_b02_ksh_wbl_joint_cells.py \
            data/processed/b02/ksh_wbl_joint_cells_2022.csv \
            data/processed/b02/ksh_wbl_joint_cell_coverage_2022.csv \
            data/processed/b02/ksh_wbl_joint_manifest.json
          git commit -m 'B02-P15 materialize complete WBL011 stock joint'
          git push origin HEAD:agent/b02-p15-wbl011-full-joint-materialization
