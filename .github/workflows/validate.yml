name: Repository validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate registry contracts
        run: python tools/validate_registry.py

      - name: Run temporary P48 export only
        run: python -m unittest discover -s tests -p 'test_b10_p48_export_probe.py' -v

      - name: Commit generated P48 pair surface
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/dso_service_area_membership_ddasz_p48_pairs.csv
          if git diff --cached --quiet; then
            echo "P48 pair surface already materialized"
            exit 0
          fi
          git commit -m "B10-P48: materialize deterministic DDASZ pair surface"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
