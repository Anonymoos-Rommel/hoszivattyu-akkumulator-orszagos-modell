name: Repository validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate registry contracts
        run: python tools/validate_registry.py

      - name: Run temporary P48 export only
        run: python -m unittest discover -s tests -p 'test_b10_p48_export_probe.py' -v
