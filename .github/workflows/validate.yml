name: Repository validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export exact P49 EDASZ pair surface
        run: python tools/tmp_p49_export_pairs.py

      - name: Commit generated P49 pair surface
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/dso_service_area_membership_edasz_p49_pairs.csv
          if git diff --cached --quiet; then
            echo "P49 pair surface already materialized"
            exit 0
          fi
          git commit -m "B10-P49: materialize EDASZ completion pairs"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
