name: Repository validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply exact P48 cross-DSO collision exclusions
        run: python tools/tmp_p48_remove_collisions.py

      - name: Commit generated P48 pair correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/dso_service_area_membership_ddasz_p48_pairs.csv
          if git diff --cached --quiet; then
            echo "P48 collision exclusions already materialized"
            exit 0
          fi
          git commit -m "B10-P48: exclude cross-DSO boundary collisions"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
