name: B10-P6 finalize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b10-p6-project-delivery-timing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded P6 metadata patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv
          import io

          root = Path('.')

          # README: append the P6 boundary exactly once.
          readme = root / 'modules/B10/README.md'
          text = readme.read_text(encoding='utf-8')
          marker = '## B10-P6 — project delivery timing evidence gate'
          if marker not in text:
              text += '''\n\n## B10-P6 — project delivery timing evidence gate\n\nB10-P6 separates source-native planned/expected completion dates, observed\nactual completion dates, retrospective schedule variance and any future\ncompletion probability. A schedule variance is `DER` only when a verified\npre-completion target and a separately evidenced actual completion refer to\nthe same project/operator. A live current project page may preserve a planned\ndate as `OBS`, but without a version-pinned pre-completion snapshot it cannot\nmint historical forecast-performance evidence.\n\nThe bounded real ledger covers the two P4 RRF projects. OPUS has a dated\n2024-09-30 ex-ante source for the 2026-04-03 target and a 2026-06-15 completion,\nso the 73-day calendar variance is `DER`. MVM's current project page states\n2026-04-30 and completion is 2026-06-15, but the target snapshot is\n`CURRENT_PAGE_ONLY`; its variance therefore remains blank/Q. No numeric\ncompletion probability is published for either project. Q-B10-002 remains\nOPEN but is now partially bounded by an executable timing-evidence contract.\nB10 readiness remains 15.\n'''
              readme.write_text(text, encoding='utf-8')

          # Add the exact dated OPUS timing source if absent.
          sources = root / 'registry/sources.csv'
          with sources.open('r', encoding='utf-8-sig', newline='') as handle:
              reader = csv.DictReader(handle)
              fieldnames = list(reader.fieldnames or [])
              rows = list(reader)
          sid = 'SRC-B10-OPUS-TITASZ-RRF-TIMING-2024'
          if not any(row.get('source_id') == sid for row in rows):
              rows.append({
                  'source_id': sid,
                  'module_id': 'B10',
                  'title': 'Hálózatfejlesztésekkel teszi lehetővé újabb napelemek telepítését az OPUS TITÁSZ Zrt.',
                  'institution': 'OPUS TITÁSZ Áramhálózati Zrt.',
                  'url': 'https://www.opustitasz.hu/tarsasagunk/sajtokozlemenyek-hirek/sajtokozlemenyek/halozatfejlesztesekkel-teszi-lehetove-ujabb-napelemek-telepiteset-az-opus-titasz-zrt',
                  'published_at': '2024-09-30',
                  'retrieved_at': '2026-09-02',
                  'reference_period': 'RRF-6.1.1-21-2022-00001 ex-ante timing snapshot',
                  'source_tier': 'P4',
                  'evidence_status': 'OBS',
                  'reliability': 'HIGH',
                  'license': 'Official OPUS public communication; raw content remains external',
                  'local_snapshot_sha256': '',
                  'notes': 'Exact dated ex-ante project communication: identifies RRF-6.1.1-21-2022-00001 and states the 378 MW target by 2026-04-03 and expectation to meet/exceed it by that date. Timing authority only; not a generic delay model, completion probability, programme causality or programme CAPEX authority.',
              })
          with sources.open('w', encoding='utf-8', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=fieldnames, lineterminator='\n')
              writer.writeheader(); writer.writerows(rows)

          # Update B10 gate note by key, preserving readiness 15.
          module_status = root / 'registry/module_status.csv'
          with module_status.open('r', encoding='utf-8-sig', newline='') as handle:
              reader = csv.DictReader(handle); m_fields = list(reader.fieldnames or []); m_rows = list(reader)
          b10 = next((r for r in m_rows if r.get('module_id') == 'B10'), None)
          if b10 is None or b10.get('readiness_percent') != '15':
              raise SystemExit('B10 module/readiness anchor missing')
          if 'B10-P6' not in b10.get('gate_note', ''):
              b10['gate_note'] = b10['gate_note'].replace(
                  'B10-P5 adds the exact-node reinforcement/evidence gate and claim-specific programme-CAPEX authority; incremental CAPEX remains unclaimed.',
                  'B10-P5 adds the exact-node reinforcement/evidence gate and claim-specific programme-CAPEX authority; incremental CAPEX remains unclaimed. B10-P6 adds source-qualified project-delivery timing evidence and retrospective variance without manufacturing completion probability.'
              )
              if 'B10-P6' not in b10['gate_note']:
                  raise SystemExit('B10 gate-note P5 anchor missing')
          with module_status.open('w', encoding='utf-8', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=m_fields, lineterminator='\n')
              writer.writeheader(); writer.writerows(m_rows)

          # Update Q-B10-002 by key; it remains OPEN.
          oq = root / 'registry/open_questions.csv'
          with oq.open('r', encoding='utf-8-sig', newline='') as handle:
              reader = csv.DictReader(handle); q_fields = list(reader.fieldnames or []); q_rows = list(reader)
          q = next((r for r in q_rows if r.get('question_id') == 'Q-B10-002'), None)
          if q is None or q.get('status') != 'OPEN':
              raise SystemExit('Q-B10-002 OPEN anchor missing')
          q['notes'] = ('B10-P6 részlegesen körülhatárolja az időzítési evidenciát: külön kezeli a source-native planned/expected targetet, '
                        'az OBS actual completion dátumot, a verified ex-ante vs current-page-only snapshotot és az ezekből számítható DER calendar variance-t. '
                        'Az OPUS 2024-09-30 -> 2026-04-03 target és 2026-06-15 completion alapján 73 nap DER; az MVM current-page 2026-04-30 targetből '
                        'pre-completion snapshot nélkül nem számol forecast errort. Reprezentatív projektkohorsz, státuszátmeneti történet, kalibrált completion-probability '
                        'modell és jövőbeli timed investment path továbbra is Q.')
          with oq.open('w', encoding='utf-8', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=q_fields, lineterminator='\n')
              writer.writeheader(); writer.writerows(q_rows)

          # Extend registry validator minimally.
          validator = root / 'tools/validate_registry.py'
          v = validator.read_text(encoding='utf-8')
          header_anchor = '''    "incremental_capex_attribution.csv": [\n        "attribution_id",\n        "baseline_id",\n        "intervention_id",\n        "region_id",\n        "cost_component",\n        "baseline_cost_huf",\n        "incremental_cost_huf",\n        "allocation_rule",\n        "source_ids",\n        "evidence_status",\n        "status",\n        "notes",\n    ],\n'''
          timing_header = header_anchor + '''    "project_delivery_timing.csv": [\n        "timing_id",\n        "project_id",\n        "network_operator",\n        "target_claim_type",\n        "target_date",\n        "target_snapshot_status",\n        "actual_completion_date",\n        "schedule_variance_days",\n        "schedule_variance_status",\n        "completion_probability",\n        "completion_probability_status",\n        "source_ids",\n        "evidence_status",\n        "status",\n        "notes",\n    ],\n'''
          if '"project_delivery_timing.csv"' not in v:
              if header_anchor not in v: raise SystemExit('validator timing header anchor missing')
              v = v.replace(header_anchor, timing_header, 1)

          v = v.replace(
              '"""Validate B10-P3/P4 truth plus the B10-P5 fail-closed registry boundary."""',
              '"""Validate B10-P3/P4/P5 truth plus the B10-P6 timing boundary."""',
              1,
          )
          v = v.replace('errors.append("B10-P5 must preserve readiness at 15")', 'errors.append("B10-P6 must preserve readiness at 15")', 1)
          old_gate = 'if any(name not in b10.get("gate_note", "") for name in ("B10-P3", "B10-P4", "B10-P5")):\n                errors.append("B10 module gate note must name B10-P3, B10-P4 and B10-P5")'
          new_gate = 'if any(name not in b10.get("gate_note", "") for name in ("B10-P3", "B10-P4", "B10-P5", "B10-P6")):\n                errors.append("B10 module gate note must name B10-P3, B10-P4, B10-P5 and B10-P6")'
          if old_gate in v:
              v = v.replace(old_gate, new_gate, 1)
          elif 'B10-P6' not in v[v.find('def validate_b10_artifacts'):v.find('baseline_path =', v.find('def validate_b10_artifacts'))]:
              raise SystemExit('validator B10 gate anchor missing')

          source_anchor = '''    elif p5_source.get("evidence_status") != "OBS":\n        errors.append("B10-P5 MVM process authority must remain source-native OBS")\n\n'''
          addition = source_anchor + '''    required_p6_source = "SRC-B10-OPUS-TITASZ-RRF-TIMING-2024"\n    p6_source = next((item for item in source_rows if item.get("source_id") == required_p6_source), None)\n    if p6_source is None:\n        errors.append(f"missing required B10-P6 timing authority: {required_p6_source}")\n    elif p6_source.get("evidence_status") != "OBS" or p6_source.get("published_at") != "2024-09-30":\n        errors.append("B10-P6 OPUS timing authority must remain dated source-native OBS")\n\n    timing_path = REGISTRY / "project_delivery_timing.csv"\n    if not timing_path.is_file():\n        errors.append("missing B10 registry file: project_delivery_timing.csv")\n    else:\n        _, timing_rows = read_csv(timing_path)\n        if len(timing_rows) != 2:\n            errors.append("B10-P6 must contain exactly two bounded RRF timing rows")\n        expected_timing = {\n            "RRF-6.1.1-21-2022-00006": {\n                "operator": "MVM DEMASZ", "claim": "PLANNED_COMPLETION", "target": "2026-04-30",\n                "snapshot": "CURRENT_PAGE_ONLY", "actual": "2026-06-15", "variance": "", "variance_status": "Q",\n                "refs": ("SRC-B10-MVM-DEMASZ-RRF-PROJECT-2026", "SRC-B10-MVM-DEMASZ-RRF-COMPLETION-2026"),\n            },\n            "RRF-6.1.1-21-2022-00001": {\n                "operator": "OPUS TITÁSZ", "claim": "EXPECTED_COMPLETION", "target": "2026-04-03",\n                "snapshot": "EX_ANTE_VERIFIED", "actual": "2026-06-15", "variance": "73", "variance_status": "DER",\n                "refs": ("SRC-B10-OPUS-TITASZ-RRF-TIMING-2024", "SRC-B10-OPUS-TITASZ-RRF-COMPLETION-2026"),\n            },\n        }\n        seen_timing = set()\n        for row in timing_rows:\n            project_id = row.get("project_id", "")\n            expected = expected_timing.get(project_id)\n            if expected is None or project_id in seen_timing:\n                errors.append(f"unexpected/duplicate B10-P6 timing project: {project_id!r}")\n                continue\n            seen_timing.add(project_id)\n            if row.get("network_operator") != expected["operator"] or row.get("target_claim_type") != expected["claim"]:\n                errors.append(f"B10-P6 timing identity/claim mismatch: {project_id}")\n            if row.get("target_date") != expected["target"] or row.get("target_snapshot_status") != expected["snapshot"]:\n                errors.append(f"B10-P6 target timing mismatch: {project_id}")\n            if row.get("actual_completion_date") != expected["actual"]:\n                errors.append(f"B10-P6 actual completion mismatch: {project_id}")\n            if row.get("schedule_variance_days") != expected["variance"] or row.get("schedule_variance_status") != expected["variance_status"]:\n                errors.append(f"B10-P6 schedule variance truth mismatch: {project_id}")\n            if row.get("completion_probability"):\n                errors.append(f"B10-P6 cannot publish completion probability: {project_id}")\n            if row.get("completion_probability_status") != "Q_NO_CALIBRATED_DELIVERY_MODEL":\n                errors.append(f"B10-P6 probability gate mismatch: {project_id}")\n            refs = tuple(item for item in row.get("source_ids", "").split(";") if item)\n            if refs != expected["refs"]:\n                errors.append(f"B10-P6 timing provenance mismatch: {project_id}")\n            if row.get("evidence_status") != "DER" or row.get("status") != "PARTIALLY_BOUNDED":\n                errors.append(f"B10-P6 timing row status mismatch: {project_id}")\n        if seen_timing != set(expected_timing):\n            errors.append(f"B10-P6 timing project set mismatch: {sorted(seen_timing)!r}")\n\n'''
          if 'required_p6_source = ' not in v:
              if source_anchor not in v: raise SystemExit('validator P5 source anchor missing')
              v = v.replace(source_anchor, addition, 1)
          validator.write_text(v, encoding='utf-8')
          PY
      - name: Validate P6 targeted
        run: python -m unittest tests.test_b10_p6_project_delivery_timing -v
      - name: Validate B10 suite
        run: python -m unittest discover -s tests -p 'test_b10*.py' -v
      - name: Validate registry
        run: python tools/validate_registry.py
      - name: Full repository regression
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q modules tests tools
      - name: Diff check
        run: git diff --check
      - name: Commit final metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/B10/README.md registry/sources.csv registry/module_status.csv registry/open_questions.csv tools/validate_registry.py
          if git diff --cached --quiet; then
            echo 'No metadata changes to commit'
          else
            git commit -m 'B10-P6: bind project delivery timing metadata'
            git push origin HEAD:agent/b10-p6-project-delivery-timing
          fi
