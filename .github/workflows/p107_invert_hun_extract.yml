name: P107 Invert HUN extract

on:
  push:
    branches:
      - agent/b02-p107-invert-hun-window-extract

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b02-p107-invert-hun-window-extract
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract HUN 2025 Invert window surface
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pandas pyarrow
          tmpfile="$(mktemp --suffix=.parquet)"
          curl -L --fail --retry 3 --retry-delay 2             "https://zenodo.org/records/19599551/files/INVERT_EU27_building_stock.parquet?download=1"             -o "$tmpfile"
          echo "71e630ff7c575507d385208ba832513a  $tmpfile" | md5sum -c -

          python - "$tmpfile" <<'PY'
          import csv
          import re
          import sys
          from pathlib import Path

          import pandas as pd

          source = Path(sys.argv[1])
          outdir = Path("data/processed/b02")
          outdir.mkdir(parents=True, exist_ok=True)

          cols = [
              "country",
              "year",
              "index",
              "name",
              "construction_period_start",
              "construction_period_end",
              "building_categories_index",
              "number_of_dwellings_per_building",
              "areawindows",
              "Htr_w",
              "number_of_buildings",
          ]
          df = pd.read_parquet(source, columns=cols)
          df = df[(df["country"] == "HUN") & (df["year"] == 2025)].copy()
          if df.empty:
              raise SystemExit("No HUN 2025 rows found")

          numeric = [
              "number_of_dwellings_per_building",
              "areawindows",
              "Htr_w",
              "number_of_buildings",
          ]
          for col in numeric:
              df[col] = pd.to_numeric(df[col], errors="raise")

          if (df["areawindows"] <= 0).any():
              raise SystemExit("Non-positive areawindows in HUN 2025 extract")
          if (df["Htr_w"] < 0).any():
              raise SystemExit("Negative Htr_w in HUN 2025 extract")
          if (df["number_of_buildings"] < 0).any():
              raise SystemExit("Negative number_of_buildings in HUN 2025 extract")
          if (df["number_of_dwellings_per_building"] <= 0).any():
              raise SystemExit("Non-positive dwellings_per_building")

          def generation(name):
              m = re.search(r"(?i)(?:^|[_\-\s])gen(?:eration)?[_\-\s]?(\d+)(?:$|[_\-\s])", str(name))
              if not m:
                  m = re.search(r"(?i)gen(?:eration)?[_\-\s]?(\d+)", str(name))
              return f"gen{m.group(1)}" if m else "UNKNOWN"

          category = {
              1: "SFH_SOUTHERN",
              2: "SFH",
              5: "AB_SMALL",
              6: "AB_LARGE",
          }

          df["renovation_generation"] = df["name"].map(generation)
          df["building_category"] = df["building_categories_index"].map(category).fillna("OTHER")
          df["effective_window_u_w_m2k"] = df["Htr_w"] / df["areawindows"]
          df["dwelling_weight"] = (
              df["number_of_buildings"] * df["number_of_dwellings_per_building"]
          )
          df["stock_window_area_m2"] = df["areawindows"] * df["number_of_buildings"]
          df["stock_window_htr_w_per_k"] = df["Htr_w"] * df["number_of_buildings"]
          df["model_reference_satisfied_1_10"] = df["effective_window_u_w_m2k"] <= 1.10

          keep = [
              "country",
              "year",
              "index",
              "name",
              "renovation_generation",
              "building_categories_index",
              "building_category",
              "construction_period_start",
              "construction_period_end",
              "number_of_dwellings_per_building",
              "number_of_buildings",
              "dwelling_weight",
              "areawindows",
              "Htr_w",
              "effective_window_u_w_m2k",
              "stock_window_area_m2",
              "stock_window_htr_w_per_k",
              "model_reference_satisfied_1_10",
          ]
          detail = df[keep].sort_values(
              ["renovation_generation", "building_categories_index", "construction_period_start", "index"]
          )
          detail.to_csv(
              outdir / "p107_invert_hun_2025_window_archetypes.csv",
              index=False,
              float_format="%.12g",
          )

          rows = []
          for gen, g in df.groupby("renovation_generation", dropna=False):
              dw = g["dwelling_weight"].sum()
              win_area = g["stock_window_area_m2"].sum()
              stock_htr = g["stock_window_htr_w_per_k"].sum()
              if dw <= 0 or win_area <= 0:
                  raise SystemExit(f"Non-positive aggregate weight for {gen}")
              sat_dw = g.loc[g["model_reference_satisfied_1_10"], "dwelling_weight"].sum()
              rows.append({
                  "renovation_generation": gen,
                  "archetype_rows": len(g),
                  "dwelling_weight": dw,
                  "dwelling_weight_share_of_hun_2025": dw / df["dwelling_weight"].sum(),
                  "dwelling_weighted_mean_effective_u_w_m2k": (
                      (g["effective_window_u_w_m2k"] * g["dwelling_weight"]).sum() / dw
                  ),
                  "stock_window_area_weighted_mean_u_w_m2k": stock_htr / win_area,
                  "min_effective_u_w_m2k": g["effective_window_u_w_m2k"].min(),
                  "max_effective_u_w_m2k": g["effective_window_u_w_m2k"].max(),
                  "dwelling_weight_share_at_or_below_1_10": sat_dw / dw,
              })

          summary = pd.DataFrame(rows).sort_values("renovation_generation")
          summary.to_csv(
              outdir / "p107_invert_hun_2025_window_generation_summary.csv",
              index=False,
              float_format="%.12g",
          )

          unknown = sorted(df.loc[df["renovation_generation"] == "UNKNOWN", "name"].astype(str).unique())
          with (outdir / "p107_invert_hun_2025_extract_diagnostics.csv").open("w", newline="", encoding="utf-8") as h:
              w = csv.writer(h)
              w.writerow(["metric", "value"])
              w.writerow(["source_md5", "71e630ff7c575507d385208ba832513a"])
              w.writerow(["source_rows_total", 980730])
              w.writerow(["hun_2025_rows", len(df)])
              w.writerow(["hun_2025_total_dwelling_weight", f"{df['dwelling_weight'].sum():.12g}"])
              w.writerow(["renovation_generation_count", df["renovation_generation"].nunique()])
              w.writerow(["unknown_generation_rows", int((df["renovation_generation"] == "UNKNOWN").sum())])
              w.writerow(["unknown_generation_unique_names", len(unknown)])
              w.writerow(["u_eff_min", f"{df['effective_window_u_w_m2k'].min():.12g}"])
              w.writerow(["u_eff_max", f"{df['effective_window_u_w_m2k'].max():.12g}"])
              w.writerow(["u_eff_dwelling_weighted_mean", f"{((df['effective_window_u_w_m2k']*df['dwelling_weight']).sum()/df['dwelling_weight'].sum()):.12g}"])
              for i, name in enumerate(unknown):
                  w.writerow([f"unknown_name_{i+1}", name])

          print(summary.to_string(index=False))
          print(f"HUN 2025 rows: {len(df)}")
          print(f"Unknown generation rows: {(df['renovation_generation'] == 'UNKNOWN').sum()}")
          PY

          rm -f "$tmpfile"

      - name: Commit derived HUN outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/b02/p107_invert_hun_2025_window_archetypes.csv
          git add data/processed/b02/p107_invert_hun_2025_window_generation_summary.csv
          git add data/processed/b02/p107_invert_hun_2025_extract_diagnostics.csv
          if git diff --cached --quiet; then
            echo "No derived changes"
            exit 0
          fi
          git commit -m "B02-P107 materialize HUN 2025 Invert window extract"
          git push origin HEAD:agent/b02-p107-invert-hun-window-extract
