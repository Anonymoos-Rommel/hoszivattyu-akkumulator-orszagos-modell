name: B05 P9 HungaroMet materialization probe

on:
  push:
    branches:
      - agent/b05-p9-hungaromet-winter-blocks

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download canonical HungaroMet historical archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b05p9/raw /tmp/b05p9/out
          base="https://odp.met.hu/climate/observations_hungary/hourly/historical"
          curl -fL "$base/HABP_1H_15310_20020227_20251231_hist.zip" -o /tmp/b05p9/raw/HABP_1H_15310_20020227_20251231_hist.zip
          curl -fL "$base/HABP_1H_44527_20020101_20251231_hist.zip" -o /tmp/b05p9/raw/HABP_1H_44527_20020101_20251231_hist.zip
          curl -fL "$base/HABP_1H_58102_20020101_20251231_hist.zip" -o /tmp/b05p9/raw/HABP_1H_58102_20020101_20251231_hist.zip
          curl -fL "$base/HABP_1H_46304_20020101_20251231_hist.zip" -o /tmp/b05p9/raw/HABP_1H_46304_20020101_20251231_hist.zip
          curl -fL "$base/HABP_1H_52744_20130627_20251231_hist.zip" -o /tmp/b05p9/raw/HABP_1H_52744_20130627_20251231_hist.zip
          sha256sum /tmp/b05p9/raw/*.zip

      - name: Materialize derived winter blocks
        shell: bash
        run: |
          set -euo pipefail
          python tools/materialize_b05_extreme_weather.py /tmp/b05p9/raw /tmp/b05p9/out

      - name: Emit derived outputs
        shell: bash
        run: |
          set -euo pipefail
          for f in /tmp/b05p9/out/*.csv; do
            echo "===== $(basename "$f") ====="
            cat "$f"
            echo "===== END $(basename "$f") ====="
          done
