name: B10-P6 finalize v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b10-p6-project-delivery-timing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch P6 metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv

          root = Path('.')

          def read_rows(path):
              with path.open('r', encoding='utf-8-sig', newline='') as h:
                  r = csv.DictReader(h)
                  fields = list(r.fieldnames or [])
                  rows = [{k: row.get(k, '') or '' for k in fields} for row in r]
              return fields, rows

          def write_rows(path, fields, rows):
              with path.open('w', encoding='utf-8', newline='') as h:
                  w = csv.DictWriter(h, fieldnames=fields, lineterminator='\n')
                  w.writeheader(); w.writerows(rows)

          readme = root / 'modules/B10/README.md'
          text = readme.read_text(encoding='utf-8')
          if '## B10-P6 — project delivery timing evidence gate' not in text:
              text += '''\n\n## B10-P6 — project delivery timing evidence gate\n\nB10-P6 separates source-native planned/expected completion dates, observed actual completion dates, retrospective schedule variance and future completion probability. A variance is DER only for a verified ex-ante target paired with separately evidenced actual completion for the same project/operator. A live current project page may preserve a planned date as OBS, but without a version-pinned pre-completion snapshot it cannot mint historical forecast-performance evidence.\n\nThe bounded ledger covers the two P4 RRF projects. OPUS has a dated 2024-09-30 ex-ante source for target 2026-04-03 and completion 2026-06-15, so 73 days is DER. MVM's current page states target 2026-04-30 and completion is 2026-06-15, but its target snapshot is CURRENT_PAGE_ONLY, so variance remains blank/Q. No numeric completion probability is published. Q-B10-002 stays OPEN / PARTIALLY_BOUNDED and readiness stays 15.\n'''
              readme.write_text(text, encoding='utf-8')

          sources = root / 'registry/sources.csv'
          fields, rows = read_rows(sources)
          sid = 'SRC-B10-OPUS-TITASZ-RRF-TIMING-2024'
          if not any(r.get('source_id') == sid for r in rows):
              rows.append({k: '' for k in fields})
              rows[-1].update({
                  'source_id': sid,
                  'module_id': 'B10',
                  'title': 'Hálózatfejlesztésekkel teszi lehetővé újabb napelemek telepítését az OPUS TITÁSZ Zrt.',
                  'institution': 'OPUS TITÁSZ Áramhálózati Zrt.',
                  'url': 'https://www.opustitasz.hu/tarsasagunk/sajtokozlemenyek-hirek/sajtokozlemenyek/halozatfejlesztesekkel-teszi-lehetove-ujabb-napelemek-telepiteset-az-opus-titasz-zrt',
                  'published_at': '2024-09-30',
                  'retrieved_at': '2026-09-02',
                  'reference_period': 'RRF-6.1.1-21-2022-00001 ex-ante timing snapshot',
                  'source_tier': 'P4',
                  'evidence_status': 'OBS',
                  'reliability': 'HIGH',
                  'license': 'Official OPUS public communication; raw content remains external',
                  'notes': 'Dated ex-ante timing authority for project RRF-6.1.1-21-2022-00001: 378 MW target by 2026-04-03 and expectation to meet/exceed it by that date. Not a generic delay model, completion probability, programme causality or CAPEX authority.',
              })
          write_rows(sources, fields, rows)

          module = root / 'registry/module_status.csv'
          fields, rows = read_rows(module)
          b10 = next((r for r in rows if r.get('module_id') == 'B10'), None)
          if b10 is None or b10.get('readiness_percent') != '15': raise SystemExit('B10 readiness anchor missing')
          if 'B10-P6' not in b10.get('gate_note', ''):
              anchor = 'B10-P5 adds the exact-node reinforcement/evidence gate and claim-specific programme-CAPEX authority; incremental CAPEX remains unclaimed.'
              replacement = anchor + ' B10-P6 adds source-qualified project-delivery timing evidence and retrospective variance without manufacturing completion probability.'
              b10['gate_note'] = b10['gate_note'].replace(anchor, replacement)
              if 'B10-P6' not in b10['gate_note']: raise SystemExit('B10 P5 gate anchor missing')
          write_rows(module, fields, rows)

          oq = root / 'registry/open_questions.csv'
          fields, rows = read_rows(oq)
          q = next((r for r in rows if r.get('question_id') == 'Q-B10-002'), None)
          if q is None or q.get('status') != 'OPEN': raise SystemExit('Q-B10-002 OPEN anchor missing')
          q['notes'] = ('B10-P6 részlegesen körülhatárolja az időzítési evidenciát: source-native planned/expected target, OBS actual completion, verified ex-ante vs current-page-only snapshot és DER calendar variance külön truth. OPUS 2024-09-30 -> 2026-04-03 target + 2026-06-15 completion = 73 nap DER. MVM current-page 2026-04-30 targetből pre-completion snapshot nélkül nem számol forecast errort. Reprezentatív projektkohorsz, státuszátmeneti történet, kalibrált completion-probability modell és future timed investment path továbbra is Q.')
          write_rows(oq, fields, rows)

          validator = root / 'tools/validate_registry.py'
          v = validator.read_text(encoding='utf-8')
          h = '''    "incremental_capex_attribution.csv": [\n        "attribution_id",\n        "baseline_id",\n        "intervention_id",\n        "region_id",\n        "cost_component",\n        "baseline_cost_huf",\n        "incremental_cost_huf",\n        "allocation_rule",\n        "source_ids",\n        "evidence_status",\n        "status",\n        "notes",\n    ],\n'''
          th = h + '''    "project_delivery_timing.csv": [\n        "timing_id", "project_id", "network_operator", "target_claim_type", "target_date",\n        "target_snapshot_status", "actual_completion_date", "schedule_variance_days",\n        "schedule_variance_status", "completion_probability", "completion_probability_status",\n        "source_ids", "evidence_status", "status", "notes",\n    ],\n'''
          if '"project_delivery_timing.csv"' not in v:
              if h not in v: raise SystemExit('validator header anchor missing')
              v = v.replace(h, th, 1)
          v = v.replace('"""Validate B10-P3/P4 truth plus the B10-P5 fail-closed registry boundary."""', '"""Validate B10-P3/P4/P5 truth plus the B10-P6 timing boundary."""', 1)
          v = v.replace('errors.append("B10-P5 must preserve readiness at 15")', 'errors.append("B10-P6 must preserve readiness at 15")', 1)
          old = 'if any(name not in b10.get("gate_note", "") for name in ("B10-P3", "B10-P4", "B10-P5")):\n                errors.append("B10 module gate note must name B10-P3, B10-P4 and B10-P5")'
          new = 'if any(name not in b10.get("gate_note", "") for name in ("B10-P3", "B10-P4", "B10-P5", "B10-P6")):\n                errors.append("B10 module gate note must name B10-P3, B10-P4, B10-P5 and B10-P6")'
          if old in v: v = v.replace(old, new, 1)
          if 'required_p6_source = ' not in v:
              anchor = '''    elif p5_source.get("evidence_status") != "OBS":\n        errors.append("B10-P5 MVM process authority must remain source-native OBS")\n\n'''
              block = anchor + '''    required_p6_source = "SRC-B10-OPUS-TITASZ-RRF-TIMING-2024"\n    p6_source = next((item for item in source_rows if item.get("source_id") == required_p6_source), None)\n    if p6_source is None:\n        errors.append(f"missing required B10-P6 timing authority: {required_p6_source}")\n    elif p6_source.get("evidence_status") != "OBS" or p6_source.get("published_at") != "2024-09-30":\n        errors.append("B10-P6 OPUS timing authority must remain dated source-native OBS")\n\n    timing_path = REGISTRY / "project_delivery_timing.csv"\n    if not timing_path.is_file():\n        errors.append("missing B10 registry file: project_delivery_timing.csv")\n    else:\n        _, timing_rows = read_csv(timing_path)\n        expected = {\n            "RRF-6.1.1-21-2022-00006": ("MVM DEMASZ", "PLANNED_COMPLETION", "2026-04-30", "CURRENT_PAGE_ONLY", "2026-06-15", "", "Q", ("SRC-B10-MVM-DEMASZ-RRF-PROJECT-2026", "SRC-B10-MVM-DEMASZ-RRF-COMPLETION-2026")),\n            "RRF-6.1.1-21-2022-00001": ("OPUS TITÁSZ", "EXPECTED_COMPLETION", "2026-04-03", "EX_ANTE_VERIFIED", "2026-06-15", "73", "DER", ("SRC-B10-OPUS-TITASZ-RRF-TIMING-2024", "SRC-B10-OPUS-TITASZ-RRF-COMPLETION-2026")),\n        }\n        seen = set()\n        for row in timing_rows:\n            pid = row.get("project_id", ""); exp = expected.get(pid)\n            if exp is None or pid in seen:\n                errors.append(f"unexpected/duplicate B10-P6 timing project: {pid!r}"); continue\n            seen.add(pid)\n            operator, claim, target, snapshot, actual, variance, variance_status, refs_expected = exp\n            if (row.get("network_operator"), row.get("target_claim_type"), row.get("target_date"), row.get("target_snapshot_status"), row.get("actual_completion_date"), row.get("schedule_variance_days"), row.get("schedule_variance_status")) != (operator, claim, target, snapshot, actual, variance, variance_status):\n                errors.append(f"B10-P6 timing truth mismatch: {pid}")\n            if row.get("completion_probability") or row.get("completion_probability_status") != "Q_NO_CALIBRATED_DELIVERY_MODEL":\n                errors.append(f"B10-P6 probability gate mismatch: {pid}")\n            refs = tuple(x for x in row.get("source_ids", "").split(";") if x)\n            if refs != refs_expected: errors.append(f"B10-P6 timing provenance mismatch: {pid}")\n            if row.get("evidence_status") != "DER" or row.get("status") != "PARTIALLY_BOUNDED": errors.append(f"B10-P6 timing row status mismatch: {pid}")\n        if seen != set(expected) or len(timing_rows) != 2: errors.append("B10-P6 must contain exactly the two bounded RRF timing projects")\n\n'''
              if anchor not in v: raise SystemExit('validator P5 source anchor missing')
              v = v.replace(anchor, block, 1)
          validator.write_text(v, encoding='utf-8')
          PY
      - name: Targeted
        run: python -m unittest tests.test_b10_p6_project_delivery_timing -v
      - name: B10 suite
        run: python -m unittest discover -s tests -p 'test_b10*.py' -v
      - name: Registry
        run: python tools/validate_registry.py
      - name: Full regression
        run: python -m unittest discover -s tests -v
      - name: Compile and diff
        run: python -m compileall -q modules tests tools && git diff --check
      - name: Commit metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/B10/README.md registry/sources.csv registry/module_status.csv registry/open_questions.csv tools/validate_registry.py
          git diff --cached --quiet || (git commit -m 'B10-P6: bind project delivery timing metadata' && git push origin HEAD:agent/b10-p6-project-delivery-timing)
