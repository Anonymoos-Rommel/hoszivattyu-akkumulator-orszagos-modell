name: B02 P15 finalize materialization

on:
  push:
    branches:
      - agent/b02-p15-wbl011-full-joint-materialization
    paths:
      - .github/workflows/b02_p15_finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b02-p15-wbl011-full-joint-materialization
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply P15 canonical state updates
        run: |
          python - <<'PY'
          from __future__ import annotations
          import csv
          import hashlib
          import io
          import json
          from pathlib import Path

          ROOT = Path('.')
          DATA = ROOT / 'data' / 'processed' / 'b02'

          def replace_required(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'replacement anchor missing in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Keep the existing canonical builders; extend them rather than adding a parallel path.
          build = 'tools/build_b02_archetype_coverage.py'
          replace_required(
              build,
              '''    expected_wbl = {\n        "WBL011_ENVELOPE": (32_655, 4_008_541),\n        "WBL011_HEATING_FUEL": (7_682, 4_008_541),\n        "WBL017_HEAT_PUMP_BASELINE": (7_623, 3_919_564),\n    }''',
              '''    expected_wbl = {\n        "WBL011_ENVELOPE": (32_655, 4_008_541),\n        "WBL011_HEATING_FUEL": (7_682, 4_008_541),\n        "WBL011_FULL_STOCK_JOINT": (116_452, 4_008_541),\n        "WBL017_HEAT_PUMP_BASELINE": (7_623, 3_919_564),\n    }'''
          )
          replace_required(
              build,
              '''        [\n            "JOIN-B02-WBL011-CORE",\n            "county_x_settlement_type_x_construction_period_x_wall_material_x_floor_area_x_comfort_x_heating_mode_x_heating_fuel",\n            "geography;construction_period;wall_material;floor_area;comfort;heating_mode;heating_fuel",\n            "DATA-B02-KSH-WBL011",\n            "OBS",\n            "PARTIALLY_MATERIALIZED",\n            "",\n            "",\n            "dwelling",\n            "Separate envelope and heating-fuel projections are materialized; only dimensions returned together by one query are jointly observed.",\n            "Do not attach building type, primary energy, heat emitter, or temperature as OBS/DER without new joint evidence.",\n        ],''',
              '''        [\n            "JOIN-B02-WBL011-CORE",\n            "county_x_settlement_type_x_construction_period_x_wall_material_x_floor_area_x_comfort_x_heating_mode_x_heating_fuel",\n            "geography;construction_period;wall_material;floor_area;comfort;heating_mode;heating_fuel",\n            "DATA-B02-KSH-WBL011",\n            "OBS",\n            "MATERIALIZED",\n            int(wbl["WBL011_FULL_STOCK_JOINT"]["returned_records"]),\n            int(wbl["WBL011_FULL_STOCK_JOINT"]["returned_numeric_dwelling_sum"]),\n            "dwelling",\n            "The complete WBL011 stock joint is returned directly by KSH and materialized at its source-native row grain; use it instead of cross-joining the separate projections.",\n            "Do not attach building type, primary energy, heat emitter, or temperature as OBS/DER without separate authority.",\n        ],'''
          )
          replace_required(
              build,
              '''            "full_joint_evidence_status": "Q",''',
              '''            "wbl011_full_joint_materialization_status": "MATERIALIZED",\n            "full_archetype_evidence_status": "Q",'''
          )
          replace_required(
              build,
              '''            "joinability": "fail-closed grain inventory; separate margins are not cross-multiplied",''',
              '''            "joinability": "fail-closed grain inventory; the direct WBL011 full-stock joint is materialized, while the wider B02 archetype remains unresolved and separate margins are not cross-multiplied",'''
          )
          replace_required(
              build,
              '''        f"zero_bins={controls['zero_distribution_bins']} full_joint=Q"''',
              '''        f"zero_bins={controls['zero_distribution_bins']} "\n        "wbl011_full_joint=MATERIALIZED full_archetype=Q"'''
          )

          # P9 runtime logic remains fail-closed; only its current-state documentation changes.
          replace_required(
              'modules/B02/archetype_admission_gate.py',
              '''B02-P14 additionally proves that source-native WBL011\nfull-joint availability is not the same as repository materialization of that\njoint. Missing materialization, ASS-only building-type linkage, or unlinked\nMODELLED energy information therefore remain Q.''',
              '''B02-P14 proves that source-native WBL011 full-joint availability is not the\nsame as repository materialization. B02-P15 now materializes that complete\nWBL011 stock joint, so the current stock claim remains Q only because\nbuilding-type linkage and primary-energy linkage are still not authoritative.'''
          )

          # Current admission state: remove only the materialization blocker.
          reg_path = Path('registry/b02_archetype_admission_gate.csv')
          with reg_path.open(encoding='utf-8', newline='') as handle:
              rows = list(csv.DictReader(handle))
              fields = list(rows[0])
          for row in rows:
              if row['claim_id'] == 'CURRENT_STOCK_ARCHETYPE_ASSIGNMENT':
                  row['current_blockers'] = 'NO_CURRENT_BUILDING_TYPE_LINK_AUTHORITY;NO_PRIMARY_ENERGY_TO_WBL_LINK_AUTHORITY'
                  row['notes'] = ('P15 materializes the complete source-native WBL011 stock joint at 116452 rows / 4008541 occupied dwellings. '
                                  'Building-type authority remains ASS-only and the KSH energy panel remains MODELLED_UNLINKED, so current-stock admission stays Q.')
              elif row['claim_id'] == 'TECHNICAL_READINESS_ARCHETYPE':
                  row['current_blockers'] = ('NO_CURRENT_BUILDING_TYPE_LINK_AUTHORITY;NO_PRIMARY_ENERGY_TO_WBL_LINK_AUTHORITY;'
                                             'NO_CURRENT_HEAT_EMITTER_EVIDENCE;NO_CURRENT_DESIGN_TEMPERATURE_EVIDENCE')
                  row['notes'] = ('P15 closes the WBL011 repository-materialization blocker only. Current building type, primary-energy linkage, '
                                  'heat-emitter evidence and design-temperature evidence remain unresolved, so technical readiness stays Q.')
          with reg_path.open('w', encoding='utf-8', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=fields, lineterminator='\n')
              writer.writeheader(); writer.writerows(rows)

          # Current module note, no readiness uplift.
          module_path = Path('registry/module_status.csv')
          with module_path.open(encoding='utf-8', newline='') as handle:
              modules = list(csv.DictReader(handle)); module_fields = list(modules[0])
          b02 = next(row for row in modules if row['module_id'] == 'B02')
          b02['readiness_percent'] = '55'
          b02['gate_note'] = (
              'P1-H és B02-P2–P14 után B02-P15 a meglévő canonical KSH extractorban közvetlenül materializálja a pinned WBL011/V67 teljes stock-jointot: '
              '20 county/Budapest query, 116 452 source-native OBS sor és exact 4 008 541 lakott lakás. A materializált összes WBL projekció 164 412 sor; '
              'a direct full-joint használható az envelope × heating/fuel kapcsolatra, külön margók synthetic cross-joinja továbbra is tilos. '
              'A P14 és P15 retrieval raw response byte-mérete és rekordszáma 20/20 egyezik, de a raw SHA-256 nem stabil minden újralekérésnél, ezért a response hash retrieval-instance lineage, nem örök dataset fingerprint. '
              'A current-stock archetype még Q a current building-type link és primary-energy-to-WBL link hiánya miatt; technical-readiness ezen felül heat-emitter és design-temperature Q. '
              'Q-B02-001, Q-B02-002 és Q-B02-004 OPEN; national technical/final eligible count blank/Q; readiness 55%, no readiness uplift; OÉNY nem lett elküldve.'
          )
          with module_path.open('w', encoding='utf-8', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=module_fields, lineterminator='\n')
              writer.writeheader(); writer.writerows(modules)

          # P15 materialization registry derived from the committed artifact and P14 acquisition ledger.
          manifest = json.loads((DATA / 'ksh_wbl_joint_manifest.json').read_text(encoding='utf-8'))
          p14_path = Path('registry/b02_wbl011_source_native_full_joint.csv')
          with p14_path.open(encoding='utf-8', newline='') as handle:
              p14_rows = list(csv.DictReader(handle))
          p14_counties = {row['county_code']: row for row in p14_rows if row['scope_id'] != 'NATIONAL'}
          p15_queries = {
              q['county_code']: q for q in manifest['queries']
              if q['projection_id'] == 'WBL011_FULL_STOCK_JOINT'
          }
          if set(p15_queries) != set(p14_counties):
              raise SystemExit('P14/P15 county set drift')
          record_matches = sum(int(p15_queries[c]['returned_records']) == int(p14_counties[c]['joint_record_count']) for c in p15_queries)
          byte_matches = sum(int(p15_queries[c]['response_bytes']) == int(p14_counties[c]['joint_response_bytes']) for c in p15_queries)
          hash_matches = sum(p15_queries[c]['response_sha256'] == p14_counties[c]['joint_response_sha256'] for c in p15_queries)
          if record_matches != 20 or byte_matches != 20:
              raise SystemExit(f'P14/P15 semantic-size drift: records={record_matches} bytes={byte_matches}')

          full_rows = []
          with (DATA / 'ksh_wbl_joint_cells_2022.csv').open(encoding='utf-8', newline='') as handle:
              for row in csv.DictReader(handle):
                  if row['projection_id'] == 'WBL011_FULL_STOCK_JOINT':
                      full_rows.append(row)
          if len(full_rows) != 116452 or sum(int(row['dwelling_count']) for row in full_rows) != 4008541:
              raise SystemExit('full projection materialization control drift')
          semantic = hashlib.sha256()
          semantic_fields = [
              'county_code','settlement_type_code','construction_period_code','wall_material_code',
              'floor_area_code','comfort_code','heating_mode_code','heating_fuel_code','dwelling_count',
              'ksh_observation_status','evidence_status'
          ]
          for row in full_rows:
              semantic.update(('|'.join(row[field] for field in semantic_fields) + '\n').encode('utf-8'))
          semantic_hash = semantic.hexdigest()
          outputs = manifest['outputs']
          mat_fields = [
              'materialization_id','source_dataset_id','source_flow','source_version','projection_id','source_grain',
              'record_count','population_count','county_count','query_count','p14_record_count_match_count',
              'p14_response_bytes_match_count','p14_raw_hash_match_count','p14_raw_hash_differ_count',
              'full_projection_semantic_sha256','combined_output_sha256','combined_output_bytes','coverage_output_sha256',
              'materialization_status','evidence_status','retrieved_at','notes'
          ]
          mat_row = {
              'materialization_id':'MAT-B02-P15-WBL011-FULL-STOCK-JOINT',
              'source_dataset_id':'DATA-B02-KSH-WBL011','source_flow':'WBL011','source_version':'V67',
              'projection_id':'WBL011_FULL_STOCK_JOINT',
              'source_grain':'county_x_settlement_type_x_construction_period_x_wall_material_x_floor_area_x_comfort_x_heating_mode_x_heating_fuel',
              'record_count':'116452','population_count':'4008541','county_count':'20','query_count':'20',
              'p14_record_count_match_count':str(record_matches),'p14_response_bytes_match_count':str(byte_matches),
              'p14_raw_hash_match_count':str(hash_matches),'p14_raw_hash_differ_count':str(20-hash_matches),
              'full_projection_semantic_sha256':semantic_hash,
              'combined_output_sha256':outputs['ksh_wbl_joint_cells_2022.csv']['sha256'],
              'combined_output_bytes':str(outputs['ksh_wbl_joint_cells_2022.csv']['bytes']),
              'coverage_output_sha256':outputs['ksh_wbl_joint_cell_coverage_2022.csv']['sha256'],
              'materialization_status':'MATERIALIZED','evidence_status':'DER','retrieved_at':'2026-09-05',
              'notes':('P15 extends the existing canonical extractor with a direct KSH-returned full WBL011 stock projection. '
                       'P14/P15 county record counts and response byte lengths match 20/20. Raw response hashes are retained per retrieval and are not promoted to immutable dataset fingerprints; normalized row ordering provides the repository artifact fingerprint.')
          }
          mat_path = Path('registry/b02_wbl011_full_joint_materialization.csv')
          with mat_path.open('w', encoding='utf-8', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=mat_fields, lineterminator='\n')
              writer.writeheader(); writer.writerow(mat_row)

          p15_doc = f'''# B02-P15 — WBL011 complete stock-joint repository materialization\n\nÁllapot: **REPOSITORY MATERIALIZED / CURRENT STOCK ARCHETYPE Q**\n\nDátum: **2026-09-05**\n\nKapcsolódó kérdések: `Q-B02-001`, `Q-B02-002`, `Q-B02-004`\n\n## Cél\n\nP14 bizonyította, hogy a pinned `WBL011/V67` teljes stock-jointja source-native formában elérhető. P15 ugyanazt a jointot a meglévő canonical `tools/extract_b02_ksh_wbl_joint_cells.py` útvonalon determinisztikusan materializálja a repositoryba.\n\nKanonikus határ:\n\n`SOURCE-NATIVE COMPLETE WBL011 JOINT -> REPOSITORY-MATERIALIZED COMPLETE WBL011 JOINT`\n\nde továbbra is:\n\n`REPOSITORY-MATERIALIZED COMPLETE WBL011 JOINT != POPULATED CURRENT-STOCK ARCHETYPE != TECHNICAL READINESS ARCHETYPE`\n\n## Exact materialization\n\n- source flow: `WBL011/V67`;\n- projection: `WBL011_FULL_STOCK_JOINT`;\n- county/Budapest queries: **20**;\n- materializált full-joint sor: **116 452**;\n- lakásszám: **4 008 541**;\n- teljes combined WBL artifact: **164 412** sor;\n- combined output SHA-256: `{outputs['ksh_wbl_joint_cells_2022.csv']['sha256']}`;\n- full-projection semantic SHA-256: `{semantic_hash}`.\n\nCsak ténylegesen visszaadott API-observation kerül a fájlba. Nem visszaadott kombináció nem lesz nullává alakítva.\n\n## P14 -> P15 lineage audit\n\nA P14 acquisition ledger és a P15 újralekérdezés összevetése:\n\n- county rekordszám egyezés: **{record_matches}/20**;\n- response byte-hossz egyezés: **{byte_matches}/20**;\n- raw SHA-256 egyezés: **{hash_matches}/20**;\n- raw SHA-256 eltérés: **{20-hash_matches}/20**.\n\nEzért kanonikus:\n\n`RAW RESPONSE SHA-256 = RETRIEVAL-INSTANCE LINEAGE != IMMUTABLE DATASET FINGERPRINT`\n\nA raw hash eltérés önmagában nem jelent observation-driftet, ha a source query, rekordszám, byte-hossz és materializált semantic controls változatlanok. A repository artifact rendezett, normalizált sorokból készül és saját output hash-t kap.\n\n## Admission impact\n\nP15 lezárja a jelenlegi P9 sub-blockert:\n\n`NO_MATERIALIZED_COMPLETE_WBL_JOINT` -> **CLOSED**\n\nA `CURRENT_STOCK_ARCHETYPE_ASSIGNMENT` azonban továbbra is `Q`, mert hiányzik:\n\n- `NO_CURRENT_BUILDING_TYPE_LINK_AUTHORITY`;\n- `NO_PRIMARY_ENERGY_TO_WBL_LINK_AUTHORITY`.\n\nA `TECHNICAL_READINESS_ARCHETYPE` ezen felül továbbra is blokkolt:\n\n- `NO_CURRENT_HEAT_EMITTER_EVIDENCE`;\n- `NO_CURRENT_DESIGN_TEMPERATURE_EVIDENCE`.\n\n## Tiltott következtetések\n\n- A direct WBL011 full joint nem ad building-type authorityt.\n- A KSH MODELLED primary-energy panel nem válik WBL-jointtá.\n- Heating mode/fuel nem imputál heat-emittert vagy design temperature-t.\n- A külön envelope és heating/fuel projekciókat nem kell és nem szabad synthetic módon cross-joinolni; a direct full-joint projection használandó.\n- Missing/Q nem nulla.\n\n## Q-impact és readiness\n\n- `Q-B02-001`: **OPEN**;\n- `Q-B02-002`: **OPEN**, de a WBL011 repository-materialization sub-blocker lezárt;\n- `Q-B02-004`: **OPEN**;\n- national technical/final eligible count: **blank / Q**;\n- B02 readiness: **55%**;\n- **no readiness uplift**;\n- OÉNY request: **nem lett elküldve**.\n'''
          Path('docs/source_packs/B02_P15_WBL011_FULL_JOINT_MATERIALIZATION.md').write_text(p15_doc, encoding='utf-8')

          # Refresh P9 current-state source pack rather than changing its executable gate semantics.
          Path('docs/source_packs/B02_P9_ARCHETYPE_ADMISSION_GATE.md').write_text('''# B02-P9 — Archetype admission gate\n\nÁllapot: **FAIL-CLOSED CONTRACTED / CURRENT STOCK ARCHETYPE Q**\n\nKapcsolódó kérdések: `Q-B02-001`, `Q-B02-002`, `Q-B02-004`\n\n## Cél\n\nB02-P9 különválasztja a szerződött dimenziós sémát, a populated current-stock archetype-ot és a technical-readiness archetype-ot.\n\n`CONTRACTED DIMENSION SCHEMA != POPULATED CURRENT-STOCK ARCHETYPE != TECHNICAL READINESS ARCHETYPE`\n\n## Current evidence state\n\n### 1. WBL011 stock joint\n\nP14 a pinned `WBL011/V67` teljes source-native stock-jointját QUALIFIED-ra emelte. P15 ugyanazt a grain-t a canonical extractorban repository-artifactként materializálta: **116 452** direct observation sor, exact **4 008 541** lakott lakás.\n\n`SOURCE-NATIVE COMPLETE WBL011 JOINT != REPOSITORY-MATERIALIZED COMPLETE WBL011 JOINT != CURRENT-STOCK ARCHETYPE`\n\nA materializációs oldal most teljesült. A külön `WBL011_ENVELOPE` és `WBL011_HEATING_FUEL` margók synthetic cross-joinja továbbra is tiltott; a direct `WBL011_FULL_STOCK_JOINT` projection használandó.\n\n### 2. Building-type assignment\n\nA `FAMILY_HOUSE` / `MULTI_DWELLING` taxonomy szerződött, de a 2022 WBL állományra alkalmazott kapcsolat továbbra is a 2015-ös településtípusos `ASS` proxy.\n\n`CONTRACTED BUILDING-TYPE TAXONOMY != CURRENT BUILDING-TYPE STOCK ASSIGNMENT`\n\n### 3. Primary-energy linkage\n\nA KSH 2025 energetikai panel building type × construction period × primary-energy bin grainen `MODELLED`, és nincs explicit WBL-link authority.\n\n`MODELLED ENERGY PANEL != PRIMARY-ENERGY-TO-WBL LINK AUTHORITY`\n\n## Executable admission contract\n\nA current-stock archetype `QUALIFIED` csak akkor lehet, ha egyszerre:\n\n1. schema = `CONTRACTED`;\n2. WBL joint repositoryban determinisztikusan materializált és complete;\n3. current building-type link = `OBS`, `DER` vagy külön admitted calibrated model;\n4. primary-energy link explicit WBL authorityt hordoz.\n\nP15 után a canonical current state:\n\n- schema: `CONTRACTED`;\n- WBL011 source-native full joint: `QUALIFIED`;\n- WBL011 repository full-joint materialization: `MATERIALIZED`;\n- building type: `ASS`;\n- primary energy: `MODELLED_UNLINKED`.\n\nKimenet: `Q`.\n\nA current blockers:\n\n- `NO_CURRENT_BUILDING_TYPE_LINK_AUTHORITY`;\n- `NO_PRIMARY_ENERGY_TO_WBL_LINK_AUTHORITY`.\n\nA technical-readiness archetype ezek mellett current heat-emitter és design-temperature `OBS`/`DER` evidence-et is igényel. Mindkettő jelenleg `Q`.\n\n## Machine-readable state\n\n- `registry/b02_archetype_admission_gate.csv`;\n- `registry/b02_wbl011_source_native_full_joint.csv` — P14 retrieval evidence;\n- `registry/b02_wbl011_full_joint_materialization.csv` — P15 repository materialization evidence.\n\n## Q-impact\n\n- `Q-B02-002` OPEN: a materialization sub-blocker lezárt, de current building-type authority és primary-energy linkage nincs.\n- `Q-B02-001` OPEN: current technical-readiness archetype és national technical eligible count nincs.\n- `Q-B02-004` OPEN: current heat-emitter és design-temperature evidence nincs.\n\n## Tiltott következtetések\n\n- `CONTRACTED` schema nem evidence promotion.\n- Direct WBL011 full joint nem building-type vagy primary-energy authority.\n- `ASS` building-type proxy nem current stock authority.\n- `MODELLED` primary-energy panel nem WBL assignment authority.\n- Heating mode/fuel nem imputál heat emittert vagy design temperature-t.\n- Missing/Q nem nulla.\n\n## Readiness\n\nB02 readiness változatlanul **55%**. P15 valódi blocker reductiont és repository materializationt hoz, de current-stock archetype-ot vagy technical/final eligible countot még nem engedélyez.\n''', encoding='utf-8')

          # P1-G current-state refresh.
          Path('docs/source_packs/P1G_B02_ARCHETYPE_COVERAGE_AND_JOINABILITY.md').write_text('''# P1-G forráscsomag: B02 archetípus-cellalefedettség és összekapcsolhatóság\n\nÁllapot: **WBL011 full stock joint materialized; teljes B02 archetípuseloszlás továbbra sem igazolt**\n\nCurrent-state frissítés: **2026-09-05 / B02-P15**\n\nKapcsolódó kérdések: `Q-B02-001`, `Q-B02-002`, `Q-B02-004`\n\n## Döntési eredmény\n\nA current B02 adatcsomag több, eltérő authority-grainen áll:\n\n1. a KSH energetikai publikáció 16 épülettípus × építési időszak cellát és 944 primerenergia-bint ad `MODELLED` státuszban;\n2. a 2015-ös lakásfelmérésből 2022-re vetített building-type kapcsolat 8 `ASS` proxycella;\n3. a pinned `WBL011/V67` direct full-stock joint P15-ben **116 452** `OBS` sorral és **4 008 541** lakással repositoryban materializált;\n4. a WBL017 hőszivattyú-baseline továbbra is külön grain és nem teljes occupied-population joint.\n\nHőleadó- és tervezési hőmérsékletadat továbbra sincs. Ezért nem áll rendelkezésre teljes közös eloszlás a terület × épülettípus × építési kor × falazat × alapterület × komfort × fűtés × tüzelőanyag × primerenergia × hőleadó × hőmérséklet grainen.\n\n## Energetikai cellalefedettség\n\nA 16 KSH-modellezett building-type × construction-period cella publikált energiaigény-binjeinek összege 4 575 790 lakás. A 944 binből 864 pozitív és 80 nulla. Ez MODELLED source surface; nem WBL assignment authority.\n\n## Összekapcsolhatósági mátrix\n\n| Részgrain | Státusz | Megengedett | Tiltott új authority nélkül |\n| --- | --- | --- | --- |\n| WBL011 direct full stock joint | `OBS`, `MATERIALIZED` | geography, construction period, wall, area, comfort, heating mode, fuel ugyanazon source-native sorban | building type, primary energy, heat emitter, design temperature |\n| WBL011 envelope / heating-fuel margók | `OBS`, `MATERIALIZED` | önálló részgrain elemzés | egymás synthetic cross-joinja; combined elemzéshez a direct full joint kell |\n| WBL017 heat-pump baseline | `OBS`, részgrain | combined heating/fuel × HOSZIV | technical eligibility, emitter, temperature |\n| KSH energetikai eloszlás | `MODELLED`, `MATERIALIZED` | building type × period × primary energy | WBL subcell assignment authority |\n| Building-type proxy | `ASS`, `MATERIALIZED` | settlement type × building type total | county/period/wall/area/comfort/heating/fuel subcell promotion |\n| OÉNY emitter/temperature | `Q`, not acquired | semmi a gate teljesítéséig | heating/fuel alapú imputáció |\n| Teljes B02 archetype | `Q` | csak új joint authority vagy admitted calibrated model után | külön margók dokumentálatlan keresztbeszorzása |\n\nA külön margók keresztbeszorzása tilos. A P15 WBL011 full joint ezt a WBL011-en belüli combined kapcsolatot source-native módon oldja meg, nem independence assumptionnel.\n\n## Reprodukció és lineage\n\n```powershell\npython tools/extract_b02_ksh_wbl_joint_cells.py --output-dir data/processed/b02 --retrieved-at 2026-09-05\npython tools/build_b02_archetype_coverage.py --data-dir data/processed/b02 --retrieved-at 2026-09-05\n```\n\nA `b02_archetype_coverage_manifest.json` a repo-bemenetek és derived outputok hashét rögzíti. A teljes B02 archetype továbbra is Q.\n\n## Következő B02 kapuk\n\n1. current WBL-compatible building-type authority vagy admitted calibrated linkage;\n2. primary-energy-to-WBL link authority vagy admitted calibrated linkage;\n3. heat-emitter és design-temperature current evidence;\n4. OÉNY request csak Joseph külön send authorityjával.\n\n## Nem következik ebből\n\n- nincs új technikailag alkalmas lakásszám;\n- nincs országos heat-emitter vagy design-temperature distribution;\n- nincs primary-energy OBS promotion;\n- a 4 008 541 direct WBL011 stock universe nem azonos technical/final eligible stockkal.\n''', encoding='utf-8')

